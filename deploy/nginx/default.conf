# www.yxxlhz.com - serve content on both HTTP and HTTPS.
# Do NOT redirect HTTP -> HTTPS at origin: behind CDN it can cause
# 301-to-self loops if anything ever forwards HTTPS to origin :80.
# Let the CDN enforce HTTPS at its edge (ESA "强制跳转 HTTPS"),
# and HSTS keep browsers on HTTPS after first visit.
server {
    listen 80;
    listen 443 ssl;
    server_name www.yxxlhz.com;

    ssl_certificate /etc/nginx/ssl/www.yxxlhz.com.cer;
    ssl_certificate_key /etc/nginx/ssl/www.yxxlhz.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/web;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location /api/ {
        expires off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /api-server/ {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# Apex yxxlhz.com -> www.yxxlhz.com (both HTTP and HTTPS).
# Mark this redirect non-cacheable so CDN can never pin it.
server {
    listen 80;
    listen 443 ssl;
    server_name yxxlhz.com;

    ssl_certificate /etc/nginx/ssl/www.yxxlhz.com.cer;
    ssl_certificate_key /etc/nginx/ssl/www.yxxlhz.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Cache-Control "no-store, must-revalidate" always;

    location /.well-known/acme-challenge/ {
        root /var/www/web;
        allow all;
    }

    location / {
        return 301 https://www.yxxlhz.com$request_uri;
    }
}

# Default catch-all (direct IP / unrecognized Host).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/web;
    index index.html;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location /api/ {
        expires off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /api-server/ {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
